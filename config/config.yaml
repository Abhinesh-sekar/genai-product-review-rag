data:
  n_products: 50
  n_reviews: 1500
  n_eval_queries: 100
  random_seed: 42

chunking:
  chunk_size_words: 80
  chunk_overlap_words: 15
  min_chunk_length: 20

retrieval:
  top_k: 5
  similarity_metric: "cosine"
  embedding_dim: 128
  hybrid_alpha: 0.7  # 70% dense vector similarity, 30% lexical BM25

generator:
  temperature: 0.1
  max_tokens: 300
  citation_format: "[Review #{id}]"
  anti_hallucination_threshold: 0.65

evaluation:
  hit_k_values: [1, 3, 5]
  faithfulness_threshold: 0.80
